<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PALS Art Gallery · Priyam Garg</title>
    <meta name="description" content="PALS Art Gallery, Priyam Garg’s sketchbook: pencil and colour drawings of anime characters, by a software engineer in Seattle." />
    <meta name="theme-color" content="#1c4c8a" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('pals-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta property="og:title" content="PALS Art Gallery · Priyam Garg" />
    <meta property="og:description" content="Pencil and colour drawings by Priyam Garg. Turn the pages." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This sketchbook needs JavaScript to turn its pages.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
